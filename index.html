<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dwarf in Busan 정산</title>
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dwarf Busan">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1D1D1F">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
:root{
  --bg:#FFFFFF; --tile:#F5F5F7; --raised:#FFFFFF; --field:#F5F5F7; --ink:#1D1D1F; --ink-2:#86868B; --line:#E5E5EA;
  --sheet:#FFFFFF; --seg-on:#FFFFFF;
  --accent:#0071E3; --on-accent:#FFFFFF; --accent-soft:rgba(0,113,227,.1);
  --p0:#30A2BC; --p0-soft:rgba(48,162,188,.14); --p1:#F08A00; --p1-soft:rgba(255,149,0,.15);
  --good:#248A3D; --bad:#D70015; --bad-soft:rgba(255,59,48,.1);
  --shadow:0 4px 30px rgba(0,0,0,.03); --thumb:0 1px 3px rgba(0,0,0,.08), 0 1px 1px rgba(0,0,0,.04);
  color-scheme:light;
  box-sizing:border-box;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --tile:#1C1C1E; --raised:#2C2C2E; --field:#2C2C2E; --ink:#F5F5F7; --ink-2:#8E8E93; --line:#38383A;
    --sheet:#1C1C1E; --seg-on:#636366;
    --accent:#2997FF; --on-accent:#FFFFFF; --accent-soft:rgba(41,151,255,.16);
    --p0:#40C8E0; --p0-soft:rgba(64,200,224,.18); --p1:#FF9F0A; --p1-soft:rgba(255,159,10,.18);
    --good:#30D158; --bad:#FF453A; --bad-soft:rgba(255,69,58,.16);
    --shadow:0 4px 30px rgba(0,0,0,.3); --thumb:0 1px 3px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --tile:#1C1C1E; --raised:#2C2C2E; --field:#2C2C2E; --ink:#F5F5F7; --ink-2:#8E8E93; --line:#38383A;
  --sheet:#1C1C1E; --seg-on:#636366;
    --accent:#2997FF; --on-accent:#FFFFFF; --accent-soft:rgba(41,151,255,.16);
  --p0:#40C8E0; --p0-soft:rgba(64,200,224,.18); --p1:#FF9F0A; --p1-soft:rgba(255,159,10,.18);
  --good:#30D158; --bad:#FF453A; --bad-soft:rgba(255,69,58,.16);
  --shadow:0 4px 30px rgba(0,0,0,.3); --thumb:0 1px 3px rgba(0,0,0,.4);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:16px;line-height:1.5;letter-spacing:-.011em;-webkit-font-smoothing:antialiased;word-break:keep-all}
.num{font-variant-numeric:tabular-nums}
.display{font-weight:700;letter-spacing:-.022em;line-height:1.1}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent-soft);outline-offset:1px;box-shadow:0 0 0 1px var(--accent);border-radius:12px}

.wrap{max-width:1080px;margin:0 auto;padding:24px 20px 140px}
.gnb{position:fixed;top:0;left:0;right:0;padding-top:env(safe-area-inset-top,0px);z-index:30;background:rgba(29,29,31,.8);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);color:rgba(255,255,255,.8)}
/* 홈 화면 앱: iOS가 맨 위 가장자리를 흐리게 처리해서, 로고·글자를 흐림 영역 아래로 내림 */
body{padding-top:calc(52px + env(safe-area-inset-top,0px))}
/* 홈 화면 앱 상단 여백: 이 숫자 하나만 바꾸면 돼요 */
:root{--app-top-extra:24px}
@media (display-mode: standalone){
  .gnb{padding-top:calc(env(safe-area-inset-top,0px) + var(--app-top-extra));background:#1D1D1F;-webkit-backdrop-filter:none;backdrop-filter:none}
  body{padding-top:calc(52px + env(safe-area-inset-top,0px) + var(--app-top-extra));min-height:100vh}
  html{background:#1D1D1F}
}
.gnb-in{max-width:1080px;margin:0 auto;height:52px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-logo{height:26px;width:auto;flex:none;display:block;opacity:.8}
.gnb-title{margin:0;font-size:19px;font-weight:600;letter-spacing:-.022em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.gnb .icon-btn{background:transparent;color:rgba(255,255,255,.8);height:34px;min-width:34px;font-size:13.5px}
.gnb .icon-btn:hover{background:rgba(255,255,255,.14)}
.trip-sub{color:var(--ink-2);margin:0 0 24px;font-size:15px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.trip-sub .who{color:var(--ink);font-weight:500}
.av{width:var(--s,20px);height:var(--s,20px);border-radius:50%;object-fit:cover;flex:none;display:inline-block;border:1.5px solid var(--pc);background:var(--line)}
.a0{--pc:var(--p0)} .a1{--pc:var(--p1)}
.who{display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.d0{background:var(--p0)} .d1{background:var(--p1)}
.head-actions{display:flex;gap:8px;flex:none}
.icon-btn{border:0;background:var(--tile);border-radius:999px;height:38px;min-width:38px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--accent);font-size:14.5px;font-weight:500}
.icon-btn:hover{background:var(--line)}
.icon-btn svg{width:18px;height:18px}
.icon-btn[hidden]{display:none}
.sync{font-size:13px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--ink-2)}
.sync.ok i{background:var(--good)} .sync.warn i{background:var(--bad)}

.grid{display:grid;gap:24px}
@media (min-width:900px){ .grid{grid-template-columns:400px minmax(0,1fr);gap:40px;align-items:start} .side{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));padding-top:20px;margin-top:-20px;max-height:calc(100vh - 76px - env(safe-area-inset-top,0px));overflow-y:auto;scrollbar-width:none} .side::-webkit-scrollbar{display:none} }

.tile{background:var(--tile);border-radius:22px;padding:28px 24px}
.settle.tile{padding:20px}
.trip-sub{margin:0 0 26px}
.grid{margin-top:0}
.settle.tile{position:relative}
.boogi-wrap{position:absolute;right:16px;bottom:100%;width:84px;height:80px;overflow:hidden;display:flex;align-items:flex-end;pointer-events:none}
.boogi{border:0;background:none;padding:0;line-height:0;cursor:pointer;transform-origin:50% 100%;pointer-events:auto;margin-bottom:-1px}
.boogi img{width:84px;height:auto;display:block;pointer-events:none}
.boogi:focus-visible{outline-offset:-4px}
.bubble{position:absolute;right:104px;bottom:calc(100% + 22px);z-index:25;background:var(--ink);color:var(--bg);font-size:13.5px;line-height:1.4;font-weight:500;padding:8px 12px;border-radius:12px;white-space:nowrap;opacity:0;translate:0 4px;pointer-events:none;transition:opacity .2s,translate .2s;box-shadow:0 4px 30px rgba(0,0,0,.12)}
.bubble::after{content:"";position:absolute;right:-5px;bottom:10px;border:6px solid transparent;border-left-color:var(--ink);border-right:0}
.bubble.on{opacity:1;translate:0 0}
@media (max-width:520px){ .trip-sub{margin-bottom:24px} .boogi-wrap{right:10px;width:72px;height:68px} .boogi img{width:72px} .bubble{right:86px;bottom:calc(100% + 18px);max-width:calc(100% - 120px);white-space:normal} }
@media (prefers-reduced-motion:no-preference){
  .boogi{animation:peek .8s cubic-bezier(.3,1.35,.5,1) .4s both}
  .boogi.hop{animation:hop .7s ease-out}
}
@keyframes peek{from{transform:translateY(100%)}to{transform:none}}
@keyframes hop{0%{transform:none}30%{transform:translateY(60%)}60%{transform:translateY(-8px)}100%{transform:none}}
.settle .label{color:var(--ink-2);font-size:13px;margin:0;font-weight:500}
.sum-line{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:6px 0 14px}
.settle .flow{font-size:15.5px;margin:0;display:flex;align-items:center;gap:6px;flex-wrap:nowrap;white-space:nowrap;font-weight:600;letter-spacing:-.022em;min-width:0}
.settle .flow .who{gap:5px}
.settle .flow .arrow{color:var(--ink-2);font-weight:400}
.settle .amount{font-size:30px;margin:0;white-space:nowrap}
.settle .amount small{font-size:18px;margin-left:2px;font-weight:600}
.settle-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px;margin-top:16px}
.settle-actions:empty{display:none}
.act{height:44px;border:0;border-radius:12px;font-size:15px;font-weight:600;letter-spacing:-.011em}
.act.primary{background:var(--accent);color:var(--on-accent)}
.act.secondary{background:var(--accent-soft);color:var(--accent)}
.act:hover{filter:brightness(1.06)}
.pill-btn{border:0;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500;background:var(--raised);color:var(--accent);box-shadow:var(--shadow)}
.pill-btn.primary{background:var(--accent);color:var(--on-accent);box-shadow:none}
.pill-btn:hover{filter:brightness(1.05)}
.ledger table{width:100%;border-collapse:collapse;font-size:14px}
.ledger th{font-weight:500;color:var(--ink-2);text-align:right;padding:0 0 6px;font-size:12px}
.ledger th:first-child{text-align:left}
.ledger td{padding:8px 0;text-align:right;border-top:1px solid var(--line)}
.ledger td:first-child{text-align:left}
.ledger .neg{color:var(--bad)} .ledger .pos{color:var(--good)}

.card{margin-top:24px}
.card h2{font-size:20px;margin:0 0 18px;font-weight:700;letter-spacing:-.022em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
.stat b{display:block;font-size:20px;font-weight:600;letter-spacing:-.022em}
.stat span{font-size:13px;color:var(--ink-2)}
.stack{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line);gap:2px}
.stack i{display:block;height:100%}
.legend{list-style:none;padding:0;margin:18px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;font-size:14px}
.legend li{display:flex;align-items:center;gap:8px}
.legend li span:last-child{margin-left:auto;color:var(--ink-2)}
.sw{width:8px;height:8px;border-radius:50%;flex:none}

/* date segmented control */
.grid>*{min-width:0}
.tabs-wrap{position:relative;max-width:100%;width:max-content}
.tabs-wrap::before,.tabs-wrap::after{content:"";position:absolute;top:0;bottom:0;width:28px;pointer-events:none;opacity:0;transition:opacity .2s;z-index:1}
.tabs-wrap::before{left:0;border-radius:12px 0 0 12px;background:linear-gradient(90deg,var(--tile),transparent)}
.tabs-wrap::after{right:0;border-radius:0 12px 12px 0;background:linear-gradient(270deg,var(--tile),transparent)}
.tabs-wrap.more-l::before,.tabs-wrap.more-r::after{opacity:1}
.tabs{display:flex;gap:2px;overflow-x:auto;padding:3px;background:var(--tile);border-radius:12px;scrollbar-width:none;scroll-behavior:smooth;overscroll-behavior-x:contain}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;border-radius:9px;padding:7px 14px;flex:none;white-space:nowrap;font-size:14px;font-weight:500;color:var(--ink)}
.tab[aria-pressed="true"]{background:var(--seg-on);box-shadow:var(--thumb);font-weight:600}
.day{margin-top:32px}
.day-h{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 10px}
.day-h h3{margin:0;font-size:20px;font-weight:700;letter-spacing:-.022em}
.day-h span{color:var(--ink-2);font-size:15px}
.items{background:var(--tile);border-radius:18px;overflow:hidden}
.item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:none;border:0;padding:0 18px;position:relative}
.item:hover{background:var(--line)}
.item+.item::before{content:"";position:absolute;left:66px;right:0;top:0;border-top:1px solid var(--line)}
.ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:17px;flex:none}
.meta{flex:1;min-width:0;padding:13px 0}
.meta .t{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta .s{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:13px;color:var(--ink-2);margin-top:2px}
.amt{text-align:right;flex:none;align-self:stretch;display:flex;flex-direction:column;justify-content:center;padding-left:6px}
.pill{display:inline-flex;align-items:center;gap:5px}
.tag{border-radius:6px;padding:0 7px;font-size:12px;line-height:20px;font-weight:500}
.tag.solo{background:var(--p1-soft);color:var(--ink)} .tag.solo.o0{background:var(--p0-soft)}
.tag.missing{background:var(--bad-soft);color:var(--bad)}
.tag.xfer{background:var(--accent-soft);color:var(--accent)}
.amt b{display:block;font-weight:600}
.amt s{font-size:12.5px;color:var(--ink-2)}
.empty{text-align:center;padding:48px 24px;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-size:19px;margin-bottom:6px;letter-spacing:-.022em}

.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:20;
  background:var(--accent);color:var(--on-accent);border:0;border-radius:999px;padding:15px 28px;font-size:17px;font-weight:600;
  box-shadow:0 8px 30px rgba(0,113,227,.28);display:flex;align-items:center;gap:8px}
.fab svg{width:18px;height:18px}
.fab[hidden]{display:none}

.notice{background:var(--tile);color:var(--ink);font-size:14px;line-height:1.5;text-align:center;padding:14px 20px}
.notice p{max-width:760px;margin:0 auto}
.notice+.notice{border-top:1px solid var(--line)}
.notice-link{border:0;background:none;padding:0;color:var(--accent);font-size:inherit;white-space:nowrap}
.notice-link:hover{text-decoration:underline}

/* sheet */
dialog{border:0;padding:0;background:transparent;color:var(--ink);max-width:none;max-height:none;width:100%;height:100%;margin:0}
dialog::backdrop{background:rgba(0,0,0,.32);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;background:var(--sheet);border-radius:22px 22px 0 0;
  max-height:calc(100% - 24px - env(safe-area-inset-top,0px));overflow:auto;padding:10px 22px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 30px rgba(0,0,0,.08)}
@media (min-width:640px){ .sheet{bottom:50%;transform:translateY(50%);border-radius:22px;max-height:88%;padding-top:24px} .grab{display:none} }
@media (prefers-reduced-motion:no-preference){ dialog[open] .sheet{animation:up .28s cubic-bezier(.2,.8,.2,1)} }
@keyframes up{from{translate:0 28px;opacity:.5}to{translate:0 0;opacity:1}}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 16px}
.sheet h2:focus,.sheet h2:focus-visible{outline:none;box-shadow:none}
.sheet h2{font-size:26px;margin:0 0 22px}
.field{margin-bottom:18px}
.field>label,.field>.lbl{display:block;font-size:13px;color:var(--ink-2);margin-bottom:7px;font-weight:500}
.inp{width:100%;min-width:0;height:48px;border:0;background:var(--field);border-radius:12px;padding:0 14px;font-size:16px;display:block}
input[type="date"].inp{-webkit-appearance:none;appearance:none;line-height:48px;text-align:left}
input[type="date"].inp::-webkit-date-and-time-value{text-align:left}
.two>*{min-width:0}
.rate-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
@media (max-width:520px){ #expenseFields .two{grid-template-columns:1fr;gap:0} }
.inp:focus{outline:none;box-shadow:0 0 0 3px var(--accent-soft),0 0 0 1px var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.amount-wrap{position:relative}
.amount-wrap .inp{padding-right:38px;font-size:20px;font-weight:600;letter-spacing:-.022em}
.amount-wrap span{position:absolute;right:14px;top:50%;translate:0 -50%;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;background:var(--field);border-radius:999px;height:36px;padding:0 14px;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;background:var(--field);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;border-radius:9px;height:42px;padding:0 8px;font-size:14.5px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:7px}
.seg button[aria-pressed="true"]{background:var(--seg-on);box-shadow:var(--thumb);font-weight:600}
.preview{background:var(--accent-soft);border-radius:12px;padding:13px 16px;font-size:14.5px;margin:6px 0 20px}
.preview b{font-weight:600}
.actions{display:flex;gap:10px}
.btn{border:0;border-radius:12px;padding:14px 18px;font-size:16px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--on-accent);flex:1}
.btn.plain{background:var(--field);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.err{color:var(--bad);font-size:14px;margin:-6px 0 14px}
.err:empty{display:none}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));translate:-50% 0;background:rgba(29,29,31,.92);color:#F5F5F7;
  padding:11px 18px;border-radius:12px;font-size:14.5px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.toast.on{opacity:1}
@media (max-width:520px){ .settle .amount{font-size:28px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>

<!-- expense sheet -->
<dialog id="sheet" aria-labelledby="sheetTitle">
  <form class="sheet" id="form" method="dialog" novalidate>
    <div class="grab"></div>
    <h2 class="display" id="sheetTitle" tabindex="-1" autofocus style="outline:none">지출 추가</h2>

    <div id="expenseFields">
      <div class="two">
        <div class="field"><label for="fTitle">어디서</label><input class="inp" id="fTitle" placeholder="예: 돼지국밥" autocomplete="off" maxlength="40"></div>
        <div class="field"><label for="fDate">날짜</label><input class="inp" type="date" id="fDate" required></div>
      </div>
      <div class="field"><span class="lbl">분류</span><div class="chips" id="fCat"></div></div>
    </div>

    <div class="field">
      <label for="fAmount" id="amountLabel">금액</label>
      <div class="amount-wrap"><input class="inp num" id="fAmount" inputmode="numeric" placeholder="0" autocomplete="off"><span>원</span></div>
    </div>

    <div class="field" id="rateField">
      <label for="fRate">할인율 (동백전, 카드 할인 등)</label>
      <div class="rate-row">
        <div class="amount-wrap"><input class="inp num" id="fRate" inputmode="decimal" placeholder="0" style="font-size:16px;font-weight:500"><span>%</span></div>
        <div class="chips" id="rateChips" style="flex-wrap:nowrap"></div>
      </div>
    </div>

    <div class="field"><span class="lbl" id="payerLabel">누가 결제했나</span><div class="seg" id="fPayer"></div></div>

    <div id="splitFields">
      <div class="field"><span class="lbl">어떻게 나눌까</span>
        <div class="seg" id="fSplit">
          <button type="button" data-v="half">반반 나누기</button>
          <button type="button" data-v="solo">한 사람 몫</button>
        </div>
      </div>
      <div class="field" id="ownerField"><span class="lbl">누구 몫인가</span><div class="seg" id="fOwner"></div></div>
    </div>

    <div class="preview" id="preview"></div>
    <p class="err" id="formErr" role="alert"></p>
    <div class="actions">
      <button type="button" class="btn danger" id="delBtn" hidden>삭제</button>
      <button type="button" class="btn plain" id="cancelBtn">닫기</button>
      <button type="submit" class="btn primary" id="saveBtn">저장</button>
    </div>
  </form>
</dialog>

<!-- settings -->
<dialog id="settings" aria-labelledby="setTitle">

      <div class="field"><label for="sP0"><img class="av a0" data-av="0" alt="" style="--s:18px;vertical-align:-4px"> 첫 번째 사람</label><input class="inp" id="sP0" maxlength="12"></div>
      <div class="field"><label for="sP1"><img class="av a1" data-av="1" alt="" style="--s:18px;vertical-align:-4px"> 두 번째 사람</label><input class="inp" id="sP1" maxlength="12"></div>
    </div>

    <div class="actions">
      <button type="button" class="btn plain" id="setCancel">닫기</button>

    </div>
  </form>
</dialog>

    let total = 0, half = 0, solo = 0, missing = 0;
    const byCat = {};
    for (const e of state.expenses) {
      const f = finalOf(e);
      if (f == null) { if (e.kind !== "transfer") missing++; continue; }
      const p = e.payer === 1 ? 1 : 0;
      paid[p] += f;
      if (e.kind === "transfer") { owe[e.owner === 1 ? 1 : 0] += f; continue; }
      total += f;
      byCat[e.cat] = (byCat[e.cat] || 0) + f;
      if (e.split === "solo") { const o = e.owner === 1 ? 1 : 0; owe[o] += f; spentBurden[o] += f; solo += f; }
      else { owe[0] += f/2; owe[1] += f/2; spentBurden[0] += f/2; spentBurden[1] += f/2; half += f; }
    }
    const bal = [paid[0]-owe[0], paid[1]-owe[1]];
    return {paid, owe, bal, total, half, solo, missing, byCat, spentBurden};
  }

  /* ---------- render ---------- */
  function render() {
    const P = state.settings.people;
    const s = compute();
    document.title = `${state.settings.title} 정산`;
    $("tripTitle").textContent = state.settings.title;

    const dates = [...new Set(state.expenses.map(e => e.date).filter(Boolean))].sort();
    let range = "";
    if (dates.length) {
      const a = dates[0], b = dates[dates.length-1];
      range = a === b ? dayLabel(a, false) : `${dayLabel(a, false)}–${a.slice(0,7) === b.slice(0,7) ? Number(b.slice(8)) + "일" : dayLabel(b, false)}`;
    }
    $("tripSub").innerHTML =
      `<span class="who">${av(0,28)}${esc(P[0])}</span><span class="who">${av(1,28)}${esc(P[1])}</span>` +
      (range ? `<span>${esc(range)}</span>` : "") +
      (state.mode === "live" && state.stale ? `<span class="sync warn"><i></i>연결이 늦어지고 있어요</span>` : "");

    // notices
    let n = "";
    if (state.mode === "local") n += `<div class="notice"><p>아직 Firebase가 연결되지 않아서, 입력한 내용은 이 기기 브라우저에만 저장돼요. config.js를 채우면 친구와 함께 쓸 수 있어요.</p></div>`;
    if (s.missing) n += `<div class="notice"><p>금액이 비어 있는 지출이 ${s.missing}건 있어요. 채워 넣어야 정산이 맞아요. <button type="button" class="notice-link" id="fixMissing">지금 입력하기 ›</button></p></div>`;
    $("notice").innerHTML = n;
    const fm = $("fixMissing");
    if (fm) fm.onclick = () => { const e = state.expenses.find(x => x.kind !== "transfer" && finalOf(x) == null); if (e && state.canWrite) openSheet(e); };

    // settlement
    const debtor = s.bal[0] < -0.5 ? 0 : s.bal[1] < -0.5 ? 1 : -1;
    $("settleActions").innerHTML = "";
    if (state.mode === "loading" && !state.expenses.length) {
      $("settleBody").innerHTML = `<div class="sum-line"><p class="flow">불러오는 중</p></div>`;
    } else if (debtor === -1) {
      $("settleBody").innerHTML = `<div class="sum-line"><p class="flow">주고받을 돈이 없어요</p><p class="amount display num">0<small>원</small></p></div>`;
    } else {
      const creditor = 1 - debtor, amt = Math.round(-s.bal[debtor]);
      $("settleBody").innerHTML =
        `<div class="sum-line"><p class="flow"><span class="who">${av(debtor,20)}${esc(P[debtor])}</span><span class="arrow" aria-label="에서">→</span><span class="who">${av(creditor,20)}${esc(P[creditor])}</span></p><p class="amount display num">${won(amt)}<small>원</small></p></div>`;
      $("settleActions").innerHTML = (state.canWrite ? `<button type="button" class="act primary" id="xferBtn">송금 기록하기</button>` : "") + `<button type="button" class="act secondary" id="copyBtn">정산 문구 복사</button>`;
      const xb = $("xferBtn"); if (xb) xb.onclick = () => openSheet(null, {kind:"transfer", payer:debtor, owner:creditor, amount:amt});
      $("copyBtn").onclick = () => copyText(`[${state.settings.title}] ${P[debtor]} → ${P[creditor]} ${won(amt)}원 보내면 정산 끝!`);
    }
    $("ledgerBody").innerHTML = [0,1].map(i => {
      const b = rnd(s.bal[i]);
      return `<tr><td><span class="who">${av(i,22)}${esc(P[i])}</span></td><td class="num">${won(s.paid[i])}</td><td class="num">${won(s.owe[i])}</td><td class="num ${b<0?"neg":b>0?"pos":""}">${b>0?"+":""}${won(b)}</td></tr>`;
    }).join("");

    // summary
    $("stats").innerHTML =
      `<div class="stat"><b class="num">${won(s.total)}</b><span>총 지출</span></div>
       <div class="stat"><b class="num">${won(s.spentBurden[0])}</b><span>${esc(P[0])} 몫</span></div>
       <div class="stat"><b class="num">${won(s.spentBurden[1])}</b><span>${esc(P[1])} 몫</span></div>`;
    const cats = CATS.filter(c => s.byCat[c.k]).map(c => ({...c, v: s.byCat[c.k]})).sort((a,b) => b.v - a.v);
    $("stack").innerHTML = cats.map(c => `<i style="width:${(c.v/s.total*100).toFixed(2)}%;background:${c.c}"></i>`).join("");
    $("legend").innerHTML = cats.length ? cats.map(c => `<li><span class="sw" style="background:${c.c}"></span><span>${c.k}</span><span class="num">${won(c.v)}</span></li>`).join("")
      : `<li style="color:var(--ink-2)">아직 기록된 지출이 없어요.</li>`;

    // tabs
    if (state.day !== "all" && !dates.includes(state.day)) state.day = "all";
    $("tabs").innerHTML = [`<button class="tab" data-d="all" aria-pressed="${state.day==="all"}">전체</button>`]
      .concat(dates.map(d => { const [,m,dd] = d.split("-").map(Number); const multiMonth = dates[0].slice(0,7) !== dates[dates.length-1].slice(0,7);
        const wk = "일월화수목금토"[new Date(d + "T00:00").getDay()];
        return `<button class="tab" data-d="${d}" aria-pressed="${state.day===d}" aria-label="${dayLabel(d)}">${multiMonth ? m + "/" + dd : dd + "일"} <span style="color:var(--ink-2);font-weight:400">${wk}</span></button>`; })).join("");
    $("tabs").querySelectorAll(".tab").forEach(b => b.onclick = () => { state.day = b.dataset.d; render(); });
    const tb = $("tabs"), on = tb.querySelector('[aria-pressed="true"]');
    if (on && (on.offsetLeft < tb.scrollLeft || on.offsetLeft + on.offsetWidth > tb.scrollLeft + tb.clientWidth)) tb.scrollLeft = on.offsetLeft - tb.clientWidth/2 + on.offsetWidth/2;
    updateTabFade();

    // list
    const shown = state.expenses.filter(e => state.day === "all" || e.date === state.day)
      .sort((a,b) => (b.date||"").localeCompare(a.date||"") || (b.createdAt||0) - (a.createdAt||0));
    if (!shown.length) {
      $("list").innerHTML = state.mode === "loading" ? `<div class="empty">지출 목록을 불러오는 중이에요.</div>`
        : state.day === "all" && !state.expenses.length
          ? `<div class="items empty"><b>첫 지출을 기록해 보세요</b>아래 ‘지출 추가’를 누르거나, 스프레드시트에 적어 둔 기록을 불러올 수 있어요.<br><button type="button" class="btn plain" style="margin-top:14px" onclick="window.__importSeed()">스프레드시트 기록 불러오기</button></div>`
          : `<div class="items empty"><b>이 날은 기록이 없어요</b></div>`;
    } else {
      const groups = {};
      shown.forEach(e => (groups[e.date] ||= []).push(e));
      $("list").innerHTML = Object.keys(groups).sort().reverse().map(d => {
        const daySum = groups[d].filter(e => e.kind !== "transfer").reduce((a,e) => a + (finalOf(e) || 0), 0);
        return `<section class="day"><div class="day-h"><h3>${dayLabel(d)}</h3><span class="num">${won(daySum)}원</span></div><div class="items">` +
          groups[d].map(rowHTML).join("") + `</div></section>`;
      }).join("");
      $("list").querySelectorAll(".item").forEach(b => b.onclick = () => {
        const e = state.expenses.find(x => x.id === b.dataset.id);
        if (e && state.canWrite) openSheet(e);
      });
    }
    $("addBtn").hidden = !state.canWrite || state.mode === "loading";
  }

  function rowHTML(e) {
    const P = state.settings.people, f = finalOf(e);
    const p = e.payer === 1 ? 1 : 0, o = e.owner === 1 ? 1 : 0;
    if (e.kind === "transfer") {
      return `<button class="item" data-id="${esc(e.id)}"><span class="ico" style="background:var(--accent-soft)">💸</span><span class="meta"><span class="t">${esc(P[p])} → ${esc(P[o])} 송금</span>
        <span class="s"><span class="tag xfer">정산 송금</span></span></span><span class="amt"><b class="num">${won(f||0)}원</b></span></button>`;
    }
    const c = catOf(e.cat);
    const bits = [`<span>${esc(c.k)}</span>`, `<span class="pill">${av(p,16)}${esc(P[p])} 결제</span>`];
    if (e.split === "solo") bits.push(`<span class="tag solo o${o}">${esc(P[o])} 몫</span>`);
    if (f == null) bits.push(`<span class="tag missing">금액 입력 필요</span>`);
    const amt = f == null ? `<b>–</b>` : `<b class="num">${won(f)}원</b>${Number(e.rate) ? `<s class="num">${won(e.amount)}</s>` : ""}`;
    return `<button class="item" data-id="${esc(e.id)}"><span class="ico" style="background:${c.c}26">${c.e}</span><span class="meta"><span class="t">${esc(e.title || c.k)}</span>
      <span class="s">${bits.join("")}${Number(e.rate) ? `<span>할인 ${esc(e.rate)}%</span>` : ""}</span></span><span class="amt">${amt}</span></button>`;
  }

  function updateTabFade() {
    const tb = $("tabs"), w = $("tabsWrap");
    w.classList.toggle("more-l", tb.scrollLeft > 4);
    w.classList.toggle("more-r", tb.scrollLeft + tb.clientWidth < tb.scrollWidth - 4);
  }
  $("tabs").addEventListener("scroll", updateTabFade, {passive: true});
  window.addEventListener("resize", updateTabFade);

  /* ---------- sheet ---------- */
  let draft = null, editingId = null, delArmed = false;
  const sheet = $("sheet");

  function segButtons(el, val, onPick) {
    const P = state.settings.people;
    el.innerHTML = [0,1].map(i => `<button type="button" data-v="${i}" aria-pressed="${val===i}">${av(i,22)}${esc(P[i])}</button>`).join("");
    el.querySelectorAll("button").forEach(b => b.onclick = () => onPick(Number(b.dataset.v)));
  }
  function paintSheet() {
    const isX = draft.kind === "transfer";
    $("sheetTitle").textContent = isX ? (editingId ? "송금 기록 수정" : "송금 기록") : (editingId ? "지출 수정" : "지출 추가");
    $("expenseFields").hidden = false;
    $("fTitle").closest(".field").hidden = isX;
    $("fCat").closest(".field").hidden = isX;
    $("rateField").hidden = isX;
    $("splitFields").hidden = isX;
    $("amountLabel").textContent = isX ? "보낸 금액" : "금액 (할인 전)";
    $("payerLabel").textContent = isX ? "누가 보냈나" : "누가 결제했나";
    $("fCat").innerHTML = CATS.map(c => `<button type="button" class="chip" data-v="${c.k}" aria-pressed="${draft.cat===c.k}">${c.e} ${c.k}</button>`).join("");
    $("fCat").querySelectorAll(".chip").forEach(b => b.onclick = () => { draft.cat = b.dataset.v; paintSheet(); });
    $("rateChips").innerHTML = [0,8,10].map(r => `<button type="button" class="chip" data-v="${r}" aria-pressed="${(Number(draft.rate)||0)===r}">${r ? r+"%" : "없음"}</button>`).join("");
    $("rateChips").querySelectorAll(".chip").forEach(b => b.onclick = () => { draft.rate = Number(b.dataset.v); $("fRate").value = draft.rate || ""; paintSheet(); });
    segButtons($("fPayer"), draft.payer, v => { draft.payer = v; if (isX) draft.owner = 1 - v; paintSheet(); });
    $("fSplit").querySelectorAll("button").forEach(b => { b.setAttribute("aria-pressed", draft.split === b.dataset.v); b.onclick = () => { draft.split = b.dataset.v; paintSheet(); }; });
    $("ownerField").hidden = draft.split !== "solo";
    segButtons($("fOwner"), draft.owner, v => { draft.owner = v; paintSheet(); });
    $("delBtn").hidden = !editingId;
    $("delBtn").textContent = delArmed ? "정말 삭제" : "삭제";
    paintPreview();
  }
  function paintPreview() {
    const P = state.settings.people, f = finalOf(draft);
    let h;
    if (draft.kind === "transfer") {
      h = f ? `<b>${esc(P[draft.payer])}</b>님이 <b>${esc(P[draft.owner])}</b>님에게 <b class="num">${won(f)}원</b>을 보낸 걸로 기록해요.` : "보낸 금액을 입력하세요.";
    } else if (f == null) {
      h = "금액을 아직 모르면 비워 두고 나중에 채워도 돼요.";
    } else {
      const r = Number(draft.rate) || 0;
      h = (r ? `할인 적용 <b class="num">${won(f)}원</b> · ` : `<b class="num">${won(f)}원</b> · `) +
        (draft.split === "solo"
          ? (draft.owner === draft.payer ? `${esc(P[draft.owner])}님이 혼자 쓰고 혼자 냈어요. 정산엔 영향 없어요.` : `${esc(P[draft.owner])}님 몫을 ${esc(P[draft.payer])}님이 대신 냈어요.`)
          : `각자 <b class="num">${won(f/2)}원</b>씩`);
    }
    $("preview").innerHTML = h;
  }
  function openSheet(e, preset) {
    editingId = e ? e.id : null; delArmed = false;
    const lastPayer = state.expenses.length ? (state.expenses.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))[0].payer || 0) : 0;
    draft = e ? {...e} : {date: todayStr(), title:"", cat:"식비", amount:null, rate:0, payer:lastPayer, split:"half", owner:1-lastPayer, kind:"expense", ...(preset||{})};
    if (draft.kind === "transfer" && !e) { draft.date = todayStr(); }
    $("fDate").value = draft.date || todayStr();
    $("fTitle").value = draft.title || "";
    $("fAmount").value = draft.amount != null ? won(draft.amount) : "";
    $("fRate").value = Number(draft.rate) ? draft.rate : "";
    $("formErr").textContent = "";
    $("saveBtn").disabled = false;
    paintSheet();
    sheet.showModal();
    if (!e && draft.kind !== "transfer") setTimeout(() => { if (matchMedia("(pointer:fine)").matches) $("fTitle").focus(); else $("sheetTitle").focus(); }, 50);
  }
  $("fDate").oninput = ev => draft.date = ev.target.value;
  $("fTitle").oninput = ev => draft.title = ev.target.value;
  $("fAmount").oninput = ev => {
    const digits = ev.target.value.replace(/[^\d]/g, "").slice(0, 10);
    draft.amount = digits ? Number(digits) : null;
    ev.target.value = digits ? won(draft.amount) : "";
    paintPreview();
  };
  $("fRate").oninput = ev => {
    let v = ev.target.value.replace(/[^\d.]/g, "");
    let n = parseFloat(v); if (isNaN(n)) n = 0; if (n > 100) { n = 100; v = "100"; }
    ev.target.value = v; draft.rate = n;
    $("rateChips").querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", Number(b.dataset.v) === n));
    paintPreview();
  };
  $("cancelBtn").onclick = () => sheet.close();
  sheet.addEventListener("click", ev => { if (ev.target === sheet) sheet.close(); });

  $("form").onsubmit = async ev => {
    ev.preventDefault();
    if (!draft.date) { $("formErr").textContent = "날짜를 골라 주세요."; return; }
    if (draft.kind === "transfer" && !draft.amount) { $("formErr").textContent = "보낸 금액을 입력하세요."; return; }
    if (draft.kind !== "transfer" && !draft.title.trim()) { $("formErr").textContent = "어디서 쓴 돈인지 적어 주세요."; return; }
    const doc = {
      date: draft.date, title: (draft.title || "").trim(), cat: draft.kind === "transfer" ? "송금" : draft.cat,
      amount: draft.amount == null ? null : Number(draft.amount), rate: Number(draft.rate) || 0,
      payer: draft.payer, split: draft.kind === "transfer" ? "solo" : draft.split,
      owner: draft.kind === "transfer" ? 1 - draft.payer : draft.owner,
      kind: draft.kind, createdAt: draft.createdAt || Date.now()
    };
    $("saveBtn").disabled = true;
    try {
      await saveExpense(editingId, doc);
      sheet.close();
      toast(editingId ? "수정했어요" : draft.kind === "transfer" ? "송금을 기록했어요" : "추가했어요");
    } catch (err) {
      $("saveBtn").disabled = false;
      $("formErr").textContent = errMsg(err);
    }
  };
  $("delBtn").onclick = async () => {
    if (!delArmed) { delArmed = true; $("delBtn").textContent = "정말 삭제"; return; }
    try { await deleteExpense(editingId); sheet.close(); toast("삭제했어요"); }
    catch (err) { $("formErr").textContent = errMsg(err); }
  };

  /* ---------- settings ---------- */
  const setDlg = $("settings");
  $("openSettings").onclick = () => {
    $("sTitle").value = state.settings.title; $("sP0").value = state.settings.people[0]; $("sP1").value = state.settings.people[1];
    $("setErr").textContent = ""; $("setSave").disabled = !state.canWrite;
    setDlg.showModal();
  };
  $("setCancel").onclick = () => setDlg.close();
  setDlg.addEventListener("click", ev => { if (ev.target === setDlg) setDlg.close(); });
  $("setForm").onsubmit = async ev => {
    ev.preventDefault();
    const s = { title: $("sTitle").value.trim() || "우리 여행", people: [$("sP0").value.trim() || "나", $("sP1").value.trim() || "친구"] };
    try { await saveSettings(s); setDlg.close(); toast("저장했어요"); }
    catch (err) { $("setErr").textContent = errMsg(err); }
  };

  /* ---------- storage ---------- */
  function errMsg(err) {
    const c = err && err.code;
    if (c === "permission-denied") return "저장 권한이 없어요. Firestore 보안 규칙(기간 포함)을 확인하세요.";
    if (c === "resource-exhausted") return "무료 사용량을 넘었어요. 잠시 후 다시 시도하세요.";
    if (c === "unavailable") return "인터넷 연결이 불안정해요. 연결되면 자동으로 저장돼요.";
    return "저장하지 못했어요. 연결을 확인하고 다시 시도하세요.";
  }

  const LKEY = "dwarf-in-busan-v1";
  function loadLocal() { try { const v = JSON.parse(localStorage.getItem(LKEY) || "null"); if (v) { state.settings = v.settings || state.settings; state.expenses = v.expenses || []; } } catch {} }
  function saveLocal() { try { localStorage.setItem(LKEY, JSON.stringify({settings: state.settings, expenses: state.expenses})); } catch {} }

  const base = `trips/${TRIP_ID}`;
  async function saveExpense(id, data) {
    if (state.mode === "live") {
      const ref = id ? doc(db, `${base}/expenses/${id}`) : doc(collection(db, `${base}/expenses`));
      await setDoc(ref, data);
    } else {
      if (id) state.expenses = state.expenses.map(e => e.id === id ? {id, ...data} : e);
      else state.expenses.push({id: "l" + Date.now().toString(36) + Math.random().toString(36).slice(2,6), ...data});
      saveLocal(); render();
    }
  }
  async function deleteExpense(id) {
    if (state.mode === "live") await deleteDoc(doc(db, `${base}/expenses/${id}`));
    else { state.expenses = state.expenses.filter(e => e.id !== id); saveLocal(); render(); }
  }
  async function saveSettings(s) {
    if (state.mode === "live") await setDoc(doc(db, `${base}/meta/settings`), s);
    else { state.settings = s; saveLocal(); render(); }
  }

  // 스프레드시트에서 옮겨온 첫 기록 (빈 저장소일 때 한 번만 불러오기)

      ["s03","2026-11-08","동대문엽기떡볶이","식비",26500,0,0,"half",1],
      ["s04","2026-11-09","카페베네","식비",null,0,1,"half",0],
      ["s05","2026-11-09","본전돼지국밥","식비",22000,8,0,"half",1],
      ["s06","2026-11-09","GS25 부산남포점","식비",11500,8,0,"half",1],
      ["s07","2026-11-09","GS25 부산남포점","식비",3000,8,0,"half",1],
      ["s08","2026-11-10","까사부사노","식비",7000,8,0,"half",1],
      ["s09","2026-11-10","봉편옹심이메밀칼국수","식비",18000,10,0,"half",1],
      ["s10","2026-11-10","붕어빵","식비",2500,7,0,"half",1]
    ].map(([id,date,title,cat,amount,rate,payer,split,owner],i) => ({id, date, title, cat, amount, rate, payer, split, owner, kind:"expense", createdAt: 1762560000001 + i}))
  };
  async function importSeed() {
    if (state.mode === "live") {
      const batch = writeBatch(db);
      batch.set(doc(db, `${base}/meta/settings`), SEED.settings);
      SEED.expenses.forEach(({id, ...data}) => batch.set(doc(db, `${base}/expenses/${id}`), data));
      await batch.commit();
    } else {
      state.settings = SEED.settings; state.expenses = SEED.expenses.map(e => ({...e})); saveLocal(); render();
    }
  }
  window.__importSeed = async () => { try { await importSeed(); toast("시트 기록을 불러왔어요"); } catch (e) { toast(errMsg(e)); } };

  function goLocal() { state.mode = "local"; state.canWrite = true; loadLocal(); render(); }

  async function init() {
    render();
    const configured = firebaseConfig && firebaseConfig.projectId && !String(firebaseConfig.apiKey).startsWith("여기에");
    if (!configured) return goLocal();
    try {
      ({ initializeApp } = await import(FB + "firebase-app.js"));
      ({ getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, writeBatch } = await import(FB + "firebase-firestore.js"));
      db = getFirestore(initializeApp(firebaseConfig));
    } catch { return goLocal(); }
    state.mode = "live"; render();
    let gotFresh = false;
    const timer = setTimeout(() => { if (!gotFresh) { state.stale = true; render(); } }, 10000);
    onSnapshot(collection(db, `${base}/expenses`), { includeMetadataChanges: true }, snap => {
      state.expenses = snap.docs.map(x => ({id: x.id, ...x.data()}));
      if (!snap.metadata.fromCache) { gotFresh = true; clearTimeout(timer); state.stale = false; }
      render();
    }, () => { gotFresh = true; clearTimeout(timer); state.stale = true; render(); });
    onSnapshot(doc(db, `${base}/meta/settings`), snap => {
      if (snap.exists()) { const v = snap.data(); state.settings = {title: v.title || "Dwarf in Busan", people: Array.isArray(v.people) && v.people.length === 2 ? v.people : ["임경훈","김동은"]}; try { localStorage.setItem("dib-settings-cache", JSON.stringify(state.settings)); } catch {} }
      render();
    }, () => {});
  }


  async function saveFile(blob, name) {
    const url = URL.createObjectURL(new Blob([blob], {type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
    const a = document.createElement("a"); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast("엑셀 파일을 내려받았어요");
  }

  /* ---------- excel export ---------- */
  async function exportXlsx() {
    const X = window.XLSX;
    if (!X) { toast("엑셀 도구를 불러오지 못했어요. 새로고침 후 다시 시도하세요"); return; }
    if (!state.expenses.length) { toast("내보낼 기록이 아직 없어요"); return; }
    const P = state.settings.people, s = compute();
    const rows = state.expenses.slice().sort((a,b) => (a.date||"").localeCompare(b.date||"") || (a.createdAt||0) - (b.createdAt||0));
    const head = ["날짜","항목","분류","금액(원)","할인율","최종 금액(원)","결제자","정산방식","누구 몫(개인·송금)",`${P[0]} 부담`,`${P[1]} 부담`];
    const body = rows.map(e => {
      const f = finalOf(e), x = e.kind === "transfer", p = e.payer === 1 ? 1 : 0, o = e.owner === 1 ? 1 : 0;
      let b0 = null, b1 = null;
      if (f != null && !x) { if (e.split === "solo") { b0 = o === 0 ? f : 0; b1 = o === 1 ? f : 0; } else { b0 = f/2; b1 = f/2; } }
      const [y,m,d] = (e.date || "").split("-").map(Number);
      return [y ? new Date(y, m-1, d) : "", x ? `${P[p]} → ${P[o]} 송금` : e.title, x ? "송금" : e.cat,
        e.amount ?? null, Number(e.rate) ? Number(e.rate)/100 : null, f, P[p],
        x ? "송금" : e.split === "solo" ? "개인" : "N빵", (x || e.split === "solo") ? P[o] : "", b0, b1];
    });
    const ws = X.utils.aoa_to_sheet([head, ...body], {cellDates: true});
    for (let r = 1; r <= body.length; r++) {
      const set = (c, z) => { const a = X.utils.encode_cell({r, c}); if (ws[a]) ws[a].z = z; };
      set(0, "yyyy-mm-dd"); [3,5,9,10].forEach(c => set(c, "#,##0")); set(4, "0%");
    }
    ws["!cols"] = [12,22,8,11,8,13,9,9,16,12,12].map(wch => ({wch}));
    const debtor = s.bal[0] < -0.5 ? 0 : s.bal[1] < -0.5 ? 1 : -1;
    const msg = debtor < 0 ? "주고받을 돈 없음" : `${P[debtor]} → ${P[1-debtor]} ${won(-s.bal[debtor])}원`;
    const sum = [
      ["구분", P[0], P[1]],
      ["결제한 돈", s.paid[0], s.paid[1]],
      ["내야 할 돈", s.owe[0], s.owe[1]],
      ["차액 (결제 − 부담)", rnd(s.bal[0]), rnd(s.bal[1])],
      ["여행 중 각자 쓴 몫", s.spentBurden[0], s.spentBurden[1]],
      [],
      ["총 지출", s.total], ["N빵 지출", s.half], ["개인 지출", s.solo],
      [],
      ["정산", msg]
    ];
    const ws2 = X.utils.aoa_to_sheet(sum);
    Object.keys(ws2).forEach(k => { if (k[0] !== "!" && typeof ws2[k].v === "number") ws2[k].z = "#,##0"; });
    ws2["!cols"] = [{wch:20},{wch:14},{wch:14}];
    const wb = X.utils.book_new();
    X.utils.book_append_sheet(wb, ws, "지출 내역");
    X.utils.book_append_sheet(wb, ws2, "정산 요약");
    const buf = X.write(wb, {bookType: "xlsx", type: "array"});
    await saveFile(new Blob([buf]), `${state.settings.title} 정산 ${todayStr()}.xlsx`);
  }
  $("exportBtn").onclick = exportXlsx;

  /* ---------- 부기 ---------- */
  let lastLine = -1, bubbleT;
  $("boogi").onclick = () => {
    const P = state.settings.people, s = compute();
    const debtor = s.bal[0] < -0.5 ? 0 : s.bal[1] < -0.5 ? 1 : -1;
    const lines = [
      "돼지국밥은 N빵이 국룰이지예",
      "밀면 한 그릇 더 묵고 가이소",
      "영수증 챙기는 거 잊지 마래이",
      "할인율 넣었나? 동백전 아이가~",
      "바다 보러 또 온나!"
    ];
    if (debtor >= 0) lines.push(`${P[debtor]}, ${won(-s.bal[debtor])}원 퍼뜩 보내라~`, `${P[debtor]}, ${won(-s.bal[debtor])}원 퍼뜩 보내라~`);
    else lines.push("정산 끝! 수고했데이", "정산 끝! 수고했데이");
    let k; do { k = Math.floor(Math.random() * lines.length); } while (lines.length > 1 && k === lastLine);
    lastLine = k;
    const b = $("bubble"); b.textContent = lines[k]; b.classList.add("on");
    const g = $("boogi"); g.classList.remove("hop"); void g.offsetWidth; g.classList.add("hop");
    clearTimeout(bubbleT); bubbleT = setTimeout(() => b.classList.remove("on"), 2600);
  };

  /* ---------- misc ---------- */
  let tt;
  function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => el.classList.remove("on"), 1800); }
  async function copyText(t) {
    try { await navigator.clipboard.writeText(t); toast("복사했어요"); }
    catch { toast("복사하지 못했어요. 길게 눌러 직접 복사하세요"); }
  }
  $("addBtn").onclick = () => openSheet(null);

  init();
})();
</script>
</body>
